<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Đối tác - TravelMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h1 class="text-primary mb-4">Danh sách Đối tác Lữ hành</h1>

    <div class="row">
        {% for item in suppliers %}
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">
                      <a href="{% url 'supplier_detail' item.pk %}" class="text-success text-decoration-none">{{ item.name }}</a>
                    </h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ item.get_type_display }}</h6>

                    <p class="card-text">
                        <strong>Liên hệ:</strong> {{ item.agent_contact }}<br>
                        <strong>Thanh toán:</strong> {{ item.get_payment_term_display }}
                    </p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
